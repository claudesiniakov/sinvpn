name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app || true
          swift --version

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Package SinVpn.app
        run: ./scripts/build-app.sh

      - name: Smoke test (приложение не падает при запуске)
        run: |
          build/SinVpn.app/Contents/MacOS/SinVpn > smoke.log 2>&1 &
          PID=$!
          sleep 10
          screencapture -x build/screen.png || true
          if kill -0 $PID 2>/dev/null; then
            echo "Процесс жив через 10 с"
            kill $PID
            SINVPN_ICON_PREVIEW=on build/SinVpn.app/Contents/MacOS/SinVpn > /dev/null 2>&1 &
            PID2=$!
            sleep 6
            screencapture -x build/screen-on.png || true
            kill $PID2 || true
          else
            wait $PID || echo "Код выхода: $?"
            cat smoke.log
            sleep 5
            for f in ~/Library/Logs/DiagnosticReports/SinVpn*; do [ -f "$f" ] && head -120 "$f"; done
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: SinVpn-app
          path: |
            build/SinVpn.zip
            build/SinVpn.zip.sha256
            build/screen.png
            build/screen-on.png

      - name: Release notes from tag message
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" | sed '/-----BEGIN PGP/,$d' > build/RELEASE_NOTES.md
          cat build/RELEASE_NOTES.md

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: build/RELEASE_NOTES.md
          files: |
            build/SinVpn.zip
            build/SinVpn.zip.sha256
